<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alergologia Pediátric</title>
    <link rel="stylesheet" href="esqueceusenha.css">
</head>
<body>
    <div class="form-container">
        <h2>Recuperação da Senha</h2>

        <form>
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" required placeholder="Digite seu nome.">

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required placeholder="Digite seu e-mail.">

            <label for="senha">Nova Senha</label>
            <input type="password" id="senha" name="senha" required placeholder="Insira sua nova senha.">

            <label for="confirmar-senha">Confirmar Senha</label>
            <input type="password" id="confirmar-senha" name="confirmar-senha" required placeholder="Confirme sua nova senha.">

            <button type="submit" class="btn-primary-entrar" onclick="return false;">Mudar Senha</button>
            <a href="login.html" class="link">Voltar à Iniciar Sessão</a>
        </form>
    </div>
</body>
</html>
