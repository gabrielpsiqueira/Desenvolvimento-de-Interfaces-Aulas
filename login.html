<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alergologia Pediátrica</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <h2>Iniciar Sessão</h2>
        
        <form>
            <label for="usuario">Usuário<span></span></label>
            <input type="text" id="usuario" name="usuario" required placeholder="Digite seu usuário.">

            <label for="senha">Senha<span></span></label>
            <input type="password" id="senha" name="senha" required placeholder="Digite sua senha.">
            
            <div class="checkbox-container">
                <input type="checkbox" id="lembrar" name="Lembrar">
                <label for="lembrar">Lembrar Senha</label>
            </div>
            
            <button type="submit" class="btn-primary-entrar" onclick="return false;">Entrar</button>
            <a href="esqueceusenha.html" class="link">Esqueceu a Senha?</a>
        </form>
    </div>
</body>
</html>
