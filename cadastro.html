<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alergologia Pediátrica</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <div class="form-container">
        <h2>Cadastro de Paciente</h2>

        <form>
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" required placeholder="Insira seu nome completo.">

            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" required placeholder="Insira seu CPF.">

            <label for="nascimento">Data de Nascimento</label>
            <input type="date" id="nascimento" name="nascimento" required>

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" required placeholder="Ex.: (61) 91234-5678">

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required placeholder="Insira seu e-mail.">

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required placeholder="Insira uma senha.">

            <button type="submit" class="btn-primary-entrar" onclick="return false;">Cadastrar</button>
            <a href="login.html" class="link">Voltar à Iniciar Sessão</a>
        </form>
    </div>
</body>
</html>
